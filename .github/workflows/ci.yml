name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cspb1913/adguard-blockpage:latest
            ghcr.io/cspb1913/adguard-blockpage:sha-${{ github.sha }}
      - name: Smoke-test the pushed image
        run: |
          docker run -d --name bp -p 8080:8080 ghcr.io/cspb1913/adguard-blockpage:sha-${{ github.sha }}
          for i in $(seq 1 20); do curl -sf -o /dev/null localhost:8080/__blockpage/cspb-logo.png && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: blocked.example' localhost:8080/any/path)
          test "$code" = 403
          curl -s -H 'Host: blocked.example' localhost:8080/__blockpage/info | grep -q '"lookup_unconfigured"'
